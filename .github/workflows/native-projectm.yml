name: Native projectMSDL packaging
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: bash -n setup.sh start-kneipen-visuals.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('setup-windows.ps1','start-kneipen-visuals-windows.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: kneipen-native-${{ matrix.os }}
          path: |
            setup.sh
            setup-windows.ps1
            start-kneipen-visuals.sh
            start-kneipen-visuals-windows.ps1
            start-kneipen-visuals-windows.cmd
            presets/
            textures/
            README.md
