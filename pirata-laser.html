<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pirata Patata – Laser Deck</title>
<style>body{margin:0;background:#000;color:#eee;font:16px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}#panel{position:fixed;top:12px;left:12px;background:#171717ed;padding:14px;border-radius:8px;max-width:90vw}button,select,input{margin:5px}body.show #panel{display:none}small{display:block;color:#bbb}</style>
<canvas id="screen"></canvas><section id="panel"><strong>PIRATA PATATA / LASER DECK</strong><br>
<label>Logo <input id="logo" type="file" accept="image/*"></label><br>
<button id="mic">Audio-Eingang</button><button id="share">Systemaudio teilen</button><button id="demo">Demo / Audio aus</button><button id="full">Vollbild</button><br>
<label>Preset <select id="preset"><option value="laser">Pirata Laser</option><option value="dub">Pirata Dub</option><option value="orbit">Pirata Orbit</option></select></label>
<label>Intensität <input id="gain" type="range" min="0" max="2" value="1" step=".05"></label>
<label><input id="rotate" type="checkbox" checked> Rotation</label>
<label><input id="safe" type="checkbox" checked> Sanfte Lichtwechsel</label>
<small id="status">Demo aktiv – Logo auswählen. F: Vollbild · H: Bedienfeld · 1–3: Presets · B: Blackout</small></section>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('screen'), g=canvas.getContext('2d');
const img=new Image(), mask=document.createElement('canvas'), m=mask.getContext('2d',{willReadFrequently:true});
let ready=false, ac=null, stream=null, analyser=null, bins=null, generation=0, angle=0, last=0, black=false, bands=[0,0,0], phase=0;
function setLogo(url,revoke=false){img.onload=()=>{mask.width=img.naturalWidth;mask.height=img.naturalHeight;m.drawImage(img,0,0);const p=m.getImageData(0,0,mask.width,mask.height);for(let i=0;i<p.data.length;i+=4){const v=Math.min(p.data[i],p.data[i+1],p.data[i+2]);p.data[i]=255;p.data[i+1]=70;p.data[i+2]=45;p.data[i+3]=Math.max(0,(v-125)*1.9);}m.putImageData(p,0,0);ready=true;if(revoke)URL.revokeObjectURL(url);};img.onerror=()=>{if(revoke)URL.revokeObjectURL(url);$('status').textContent='Logo konnte nicht geladen werden.';};img.src=url;}
$('logo').onchange=e=>{const f=e.target.files[0];if(f)setLogo(URL.createObjectURL(f),true);};
async function stop(){generation++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;analyser=null;bins=null;const old=ac;ac=null;if(old)await old.close().catch(()=>{});}
async function audio(kind){await stop();const token=generation;try{let s=kind==='mic'?await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false}):await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});if(token!==generation){s.getTracks().forEach(t=>t.stop());return;}stream=s;if(!s.getAudioTracks().length)throw Error('Keine Audiospur freigegeben. Audio-Eingang oder Monitorquelle wählen.');ac=new AudioContext();await ac.resume();if(token!==generation)return;analyser=ac.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.75;ac.createMediaStreamSource(s).connect(analyser);bins=new Uint8Array(analyser.frequencyBinCount);s.getAudioTracks()[0].onended=()=>{if(token===generation){stop();$('status').textContent='Audio beendet – Demo aktiv.';}};$('status').textContent='Live-Audio aktiv (keine Wiedergabe, keine Übertragung).';}catch(e){if(token===generation){await stop();$('status').textContent='Audio: '+e.message;}}}
$('mic').onclick=()=>audio('mic');$('share').onclick=()=>audio('share');$('demo').onclick=()=>{stop();$('status').textContent='Demo aktiv';};
function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(e=>$('status').textContent=e.message);}
$('full').onclick=full;
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;switch(e.key.toLowerCase()){case'f':full();break;case'h':document.body.classList.toggle('show');break;case'b':black=!black;break;case'1':case'2':case'3':$('preset').selectedIndex=Number(e.key)-1;break;}});
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);}
window.addEventListener('resize',resize);resize();
function frame(ms){requestAnimationFrame(frame);const t=ms/1000,dt=Math.min(.05,last? t-last:0);last=t;const w=canvas.width,h=canvas.height;g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';g.fillStyle='#000';g.fillRect(0,0,w,h);if(black)return;
let target=[.25+.35*Math.pow(Math.max(0,Math.sin(t*3.1)),4),.25+.15*Math.sin(t*1.7),.2+.15*Math.sin(t*2.4)];
if(analyser){analyser.getByteFrequencyData(bins);const hz=ac.sampleRate/analyser.fftSize;target=[[35,160],[160,1800],[1800,8500]].map(([lo,hi])=>{let sum=0,n=0;for(let i=Math.max(1,Math.ceil(lo/hz));i<Math.min(bins.length,Math.ceil(hi/hz));i++){sum+=bins[i];n++;}return n?sum/n/255:0;});}
const safe=$('safe').checked, gain=Number($('gain').value), k=1-Math.exp(-dt*(safe?3:9));bands=bands.map((v,i)=>v+(Math.min(1,target[i]*gain)-v)*k);const [bass,mid,high]=bands, mode=$('preset').value;
angle+=($('rotate').checked?dt*(mode==='orbit'?.22:.055)*(1+bass):0);phase+=dt*(.35+mid);
const size=Math.min(w,h)*(.67+.08*bass), hue=mode==='dub'?155:mode==='orbit'?285:8;
g.translate(w/2,h/2);g.rotate(angle);g.scale(size/393,size/393);
g.globalCompositeOperation='lighter';
for(let i=0;i<48;i++){const a=i*Math.PI/24;const level=.25+.65*(.5+.5*Math.sin(i*.7-phase*3));const reach=145+65*level+50*bass;g.strokeStyle='hsla('+((hue+i*.9)%360)+',100%,55%,'+(.10+.32*level*mid)+')';g.lineWidth=1.2+2*high;g.beginPath();g.moveTo(Math.cos(a)*115,Math.sin(a)*115);g.lineTo(Math.cos(a)*reach,Math.sin(a)*reach);g.stroke();}
if(ready){g.globalCompositeOperation='source-over';g.globalAlpha=.85;g.drawImage(img,-196.5,-196.5,393,393);g.globalAlpha=1;g.globalCompositeOperation='lighter';g.globalAlpha=.2+.55*bass;g.shadowColor='orangered';g.shadowBlur=12+28*bass;g.drawImage(mask,-196.5,-196.5,393,393);g.shadowBlur=0;g.globalAlpha=1;}
else {g.fillStyle='#eee';g.font='bold 25px system-ui';g.textAlign='center';g.fillText('PIRATA PATATA',0,0);g.font='12px system-ui';g.fillText('Logo im Bedienfeld auswählen',0,25);}
if(ready){for(const [x,y] of [[-1,-55],[25,-43]]){const r=7+8*high;const glow=g.createRadialGradient(x,y,0,x,y,r);glow.addColorStop(0,'rgba(255,55,20,'+(.35+.55*mid)+')');glow.addColorStop(1,'rgba(255,0,0,0)');g.fillStyle=glow;g.fillRect(x-r,y-r,r*2,r*2);}}
g.globalCompositeOperation='source-over';}
requestAnimationFrame(frame);
</script></html>
